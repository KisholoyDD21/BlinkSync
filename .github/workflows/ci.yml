name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/site/package-lock.json
      - run: npm ci
      - run: npm run ci
      - run: npm ci
        working-directory: apps/site
      - run: npm run build
        working-directory: apps/site
